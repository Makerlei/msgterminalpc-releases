<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root { --s: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .float-root {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    z-index: 9999;
  }
  .menu {
    display: flex;
    gap: 10px;
    margin-right: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .open .menu { opacity: 1; pointer-events: auto; }
  .item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .item-btn {
    width: calc(40px * var(--s)); height: calc(40px * var(--s)); border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(15,23,42,0.92);
    color: #e2e8f0; font-size: calc(18px * var(--s));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: transform 0.15s, background 0.15s;
  }
  .item-btn:hover { transform: scale(1.1); background: rgba(30,41,59,0.98); }
  .item-label {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    font-size: calc(10px * var(--s)); color: #e2e8f0;
    background: rgba(2,6,23,0.8); padding: 2px 8px; border-radius: 6px;
    white-space: nowrap;
  }
  .trigger {
    width: calc(42px * var(--s)); height: calc(42px * var(--s)); border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(15,23,42,0.92);
    backdrop-filter: blur(8px);
    color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .trigger:hover {
    transform: scale(1.06);
    box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    background: rgba(30,41,59,0.98);
  }
  .trigger .face {
    transition: transform 0.25s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .trigger .face svg {
    width: calc(24px * var(--s));
    height: calc(24px * var(--s));
  }
  .open .trigger .face { transform: rotate(135deg); }
</style>
</head>
<body>
<div class="float-root" id="root">
  <div class="menu" id="menu">
    <div class="item" id="btnTimer">
      <div class="item-btn">&#9201;</div>
      <div class="item-label">计时</div>
    </div>
    <div class="item" id="btnDraw">
      <div class="item-btn">&#9999;&#65039;</div>
      <div class="item-label">绘图</div>
    </div>
    <div class="item" id="btnPick">
      <div class="item-btn">&#127919;</div>
      <div class="item-label">点名</div>
    </div>
    <div class="item" id="btnExam">
      <div class="item-btn">&#128203;</div>
      <div class="item-label">考试</div>
    </div>
    <div class="item" id="btnSchedule">
      <div class="item-btn">&#128218;</div>
      <div class="item-label">课表</div>
    </div>
  </div>
  <div class="trigger" id="trigger">
    <span class="face">
      <svg width="24" height="24" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="20" stroke="#ffffff" stroke-width="2.5"/>
        <circle cx="17" cy="20" r="3" fill="#ffffff"/>
        <circle cx="31" cy="20" r="3" fill="#ffffff"/>
        <path d="M15 30 Q24 38 33 30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
  </div>
</div>
<script>
  // ========== 按桌面分辨率比例缩放工具栏（笑脸 + 菜单图标） ==========
  (function applyFloatScale() {
    function apply() {
      var w = (window.screen && window.screen.width) ? window.screen.width : 1920;
      var s = (w / 1920) * 1.15;
      if (s < 0.6) s = 0.6;
      if (s > 3) s = 3;
      document.documentElement.style.setProperty('--s', s);
    }
    apply();
    window.addEventListener('resize', apply);
  })();

  var root = document.getElementById('root');
  var trigger = document.getElementById('trigger');
  var isOpen = false;
  var dragging = false;
  var dragMoved = false;
  var startCX = 0, startCY = 0;
  var startRX = 0, startRY = 0;
  var isClickThrough = false;
  var menuOpenGuard = false;

  function enableClickThrough() {
    isClickThrough = true;
    window.api.setFloatClickThrough(true);
  }
  function disableClickThrough() {
    isClickThrough = false;
    window.api.setFloatClickThrough(false);
  }

  setTimeout(enableClickThrough, 2000);

  // ========= 鼠标悬停检测 =========
  trigger.addEventListener('pointerenter', function() {
    if (isClickThrough) disableClickThrough();
  });

  document.addEventListener('pointermove', function(e) {
    if (dragging) return;
    if (isOpen) {
      if (menuOpenGuard) {
        var rect = root.getBoundingClientRect();
        var pad = 8;
        var isOnRoot = e.clientX >= rect.left - pad && e.clientX <= rect.right + pad &&
                       e.clientY >= rect.top - pad && e.clientY <= rect.bottom + pad;
        if (!isOnRoot) {
          menuOpenGuard = false;
          enableClickThrough();
        }
      }
      return;
    }
    var rect = trigger.getBoundingClientRect();
    var pad = 8;
    var isOver = e.clientX >= rect.left - pad && e.clientX <= rect.right + pad &&
                 e.clientY >= rect.top - pad && e.clientY <= rect.bottom + pad;
    if (isOver && isClickThrough) {
      disableClickThrough();
    } else if (!isOver && !isClickThrough) {
      enableClickThrough();
    }
  });

  // ========= 统一拖动开始 =========
  function dragStart(cx, cy) {
    dragging = true;
    dragMoved = false;
    startCX = cx;
    startCY = cy;
    var rect = root.getBoundingClientRect();
    startRX = rect.left;
    startRY = rect.top;
  }

  // ========= 统一拖动移动 =========
  function dragMove(cx, cy) {
    if (!dragging) return;
    var dx = cx - startCX;
    var dy = cy - startCY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
    if (dragMoved) {
      var newX = startRX + dx;
      var newY = startRY + dy;
      newX = Math.max(0, Math.min(window.innerWidth - 50, newX));
      newY = Math.max(0, Math.min(window.innerHeight - 50, newY));
      root.style.left = newX + 'px';
      root.style.top = newY + 'px';
      root.style.right = 'auto';
      root.style.transform = 'none';
    }
  }

  // ========= 统一拖动结束 =========
  function dragEnd() {
    if (!dragging) return;
    dragging = false;
    if (!dragMoved) {
      isOpen = !isOpen;
      root.classList.toggle('open', isOpen);
      if (isOpen) {
        disableClickThrough();
        menuOpenGuard = true;
      }
    }
  }

  // ========= 鼠标事件 =========
  trigger.addEventListener('mousedown', function(e) {
    dragStart(e.clientX, e.clientY);
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    dragMove(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', function() {
    dragEnd();
  });

  // ========= 菜单项 pointer 事件：阻止穿透 =========
  document.querySelectorAll('.item').forEach(function(item) {
    item.addEventListener('pointerenter', function() {
      if (isClickThrough) disableClickThrough();
      menuOpenGuard = false;
    });
    item.addEventListener('pointerdown', function(e) {
      e.stopPropagation();
      if (isClickThrough) disableClickThrough();
    });
  });

  // ========= 触摸事件 =========
  trigger.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (isClickThrough) disableClickThrough();
    var t = e.touches[0];
    dragStart(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    e.preventDefault();
    var t = e.touches[0];
    dragMove(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener('touchend', function(e) {
    dragEnd();
  });

  // ========= 点击空白关闭菜单 =========
  document.addEventListener('mousedown', function(e) {
    if (!isOpen) return;
    var rect = root.getBoundingClientRect();
    var pad = 10;
    var isOnRoot = e.clientX >= rect.left - pad && e.clientX <= rect.right + pad &&
                   e.clientY >= rect.top - pad && e.clientY <= rect.bottom + pad;
    if (!isOnRoot) {
      isOpen = false;
      root.classList.remove('open');
      enableClickThrough();
    }
  });

  document.addEventListener('touchstart', function(e) {
    if (!isOpen) return;
    var t = e.touches[0];
    var rect = root.getBoundingClientRect();
    var pad = 10;
    var isOnRoot = t.clientX >= rect.left - pad && t.clientX <= rect.right + pad &&
                   t.clientY >= rect.top - pad && t.clientY <= rect.bottom + pad;
    if (!isOnRoot) {
      isOpen = false;
      root.classList.remove('open');
      enableClickThrough();
    }
  });

  // ========= 菜单按钮 =========
  function closeMenu() {
    isOpen = false;
    menuOpenGuard = false;
    root.classList.remove('open');
  }

  document.getElementById('btnTimer').addEventListener('click', function() { window.api.openTimer(); closeMenu(); });
  document.getElementById('btnDraw').addEventListener('click', function() { window.api.openDraw(); closeMenu(); });
  document.getElementById('btnPick').addEventListener('click', function() { window.api.openRandomPick(); closeMenu(); });
  document.getElementById('btnExam').addEventListener('click', function() { window.api.openExamTimer(); closeMenu(); });
  document.getElementById('btnSchedule').addEventListener('click', function() { window.api.openSchedule(); closeMenu(); });
</script>
</body>
</html>
