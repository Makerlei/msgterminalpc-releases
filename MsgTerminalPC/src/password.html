<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f8fafc;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: #ffffff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #e2e8f0;
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 14px;
    color: #1e293b;
    font-weight: 700;
  }
  .header-btns {
    margin-left: auto;
    display: flex;
    gap: 6px;
    -webkit-app-region: no-drag;
  }
  .header-btn {
    width: 24px; height: 24px;
    border: none; border-radius: 6px;
    background: #f1f5f9; color: #64748b;
    font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .header-btn:hover { background: #e2e8f0; }
  .header-btn.close:hover { background: #fee2e2; color: #ef4444; }

  .content {
    flex: 1;
    padding: 16px 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
  }
  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 2px; }

  .lock-icon { font-size: 28px; margin-bottom: 8px; }
  .hint { font-size: 12px; color: #64748b; margin-bottom: 10px; }

  .input-wrap {
    width: 100%;
    max-width: 240px;
    margin-bottom: 6px;
  }
  .input-wrap input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    color: #1e293b;
    background: #ffffff;
    outline: none;
    text-align: center;
    letter-spacing: 3px;
    transition: border 0.2s;
  }
  .input-wrap input:focus { border-color: #3b82f6; }
  .input-wrap input::placeholder { color: #cbd5e1; letter-spacing: 0; }

  .error {
    font-size: 11px;
    color: #ef4444;
    margin-bottom: 8px;
    height: 14px;
    text-align: center;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 240px;
    margin-bottom: 8px;
  }
  .btn {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-cancel { background: #f1f5f9; color: #64748b; }
  .btn-cancel:hover { background: #e2e8f0; }
  .btn-ok {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(59,130,246,0.3);
  }
  .btn-ok:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }

  .forgot-link {
    font-size: 11px;
    color: #3b82f6;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .forgot-link:hover { text-decoration: underline; }

  /* 忘记密码面板 */
  .forgot-panel {
    display: none;
    width: 100%;
    max-width: 240px;
    padding: 10px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
  }
  .forgot-panel.show { display: block; }
  .forgot-panel .fp-label {
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 4px;
    text-align: center;
  }
  .forgot-panel .fp-hint {
    font-size: 13px;
    color: #1e293b;
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
    padding: 6px;
    background: #f8fafc;
    border-radius: 6px;
  }
  .forgot-panel .fp-reset-label {
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 4px;
    text-align: center;
  }
  .forgot-panel input {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    font-size: 13px;
    color: #1e293b;
    background: #ffffff;
    outline: none;
    text-align: center;
    margin-bottom: 6px;
  }
  .forgot-panel input:focus { border-color: #3b82f6; }
  .forgot-panel input::placeholder { color: #cbd5e1; }
  .forgot-panel .btn-reset {
    width: 100%;
    padding: 7px;
    border: none;
    border-radius: 6px;
    background: #ef4444;
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .forgot-panel .btn-reset:hover { background: #dc2626; }
  .forgot-panel .reset-msg {
    font-size: 11px;
    margin-top: 6px;
    height: 14px;
    text-align: center;
  }
  .forgot-panel .reset-msg.success { color: #10b981; }
  .forgot-panel .reset-msg.error { color: #ef4444; }
</style>
</head>
<body>
<div class="header">
  <h1>身份验证</h1>
  <div class="header-btns">
    <button class="header-btn close" id="btnClose">✕</button>
  </div>
</div>
<div class="content">
  <div class="lock-icon">🔒</div>
  <div class="hint">请输入密码</div>
  <div class="input-wrap">
    <input type="password" id="pwdInput" placeholder="输入密码" autofocus>
  </div>
  <div class="error" id="errorText"></div>
  <div class="btn-row">
    <button class="btn btn-cancel" id="btnCancel">取消</button>
    <button class="btn btn-ok" id="btnOk">确认</button>
  </div>
  <a class="forgot-link" id="forgotLink">忘记密码？</a>
  <div class="forgot-panel" id="forgotPanel">
    <div class="fp-label">密码提示</div>
    <div class="fp-hint" id="hintContent">加载中...</div>
    <div class="fp-reset-label">输入开发者QQ号强制重置</div>
    <input type="text" id="resetCode" placeholder="输入验证码">
    <button class="btn-reset" id="btnReset">强制重置</button>
    <div class="reset-msg" id="resetMsg"></div>
  </div>
</div>

<script>
  var pwdInput = document.getElementById('pwdInput');
  var errorText = document.getElementById('errorText');

  function tryVerify() {
    var pwd = pwdInput.value.trim();
    if (!pwd) {
      errorText.textContent = '请输入密码';
      return;
    }
    window.api.verifyPassword(pwd).then(function(ok) {
      if (ok) {
        window.api.closePassword();
      } else {
        errorText.textContent = '密码错误';
        pwdInput.value = '';
        pwdInput.focus();
      }
    });
  }

  document.getElementById('btnOk').addEventListener('click', tryVerify);
  document.getElementById('btnCancel').addEventListener('click', function() {
    window.api.closePassword();
  });
  document.getElementById('btnClose').addEventListener('click', function() {
    window.api.closePassword();
  });

  pwdInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryVerify();
    if (e.key === 'Escape') window.api.closePassword();
  });

  document.getElementById('forgotLink').addEventListener('click', function() {
    var panel = document.getElementById('forgotPanel');
    panel.classList.toggle('show');
    if (panel.classList.contains('show')) {
      window.api.getPasswordHint().then(function(hint) {
        document.getElementById('hintContent').textContent = hint || '未设置提示';
      });
    }
  });

  document.getElementById('btnReset').addEventListener('click', function() {
    var code = document.getElementById('resetCode').value.trim();
    var msgEl = document.getElementById('resetMsg');
    if (!code) {
      msgEl.textContent = '请输入验证码';
      msgEl.className = 'reset-msg error';
      return;
    }
    window.api.forceResetPassword(code).then(function(result) {
      if (result.ok) {
        msgEl.textContent = result.msg;
        msgEl.className = 'reset-msg success';
        setTimeout(function() { window.api.closePassword(); }, 1500);
      } else {
        msgEl.textContent = result.msg;
        msgEl.className = 'reset-msg error';
      }
    });
  });

  setTimeout(function() { pwdInput.focus(); }, 100);
</script>
</body>
</html>
