<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f8fafc;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  .header h1 { font-size: 16px; color: #ffffff; font-weight: 700; letter-spacing: 1px; }
  .header-btns { margin-left: auto; display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .header-btn {
    width: 28px; height: 28px; border: none; border-radius: 6px;
    background: rgba(255,255,255,0.2); color: #ffffff;
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .header-btn:hover { background: rgba(255,255,255,0.35); }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 16px;
  }
  .update-icon { font-size: 48px; }
  .title { font-size: 18px; font-weight: 700; color: #0f172a; }
  .version-info { font-size: 13px; color: #64748b; }
  .version-info span { color: #3b82f6; font-weight: 700; }
  .changelog-box {
    width: 100%;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    color: #475569;
    line-height: 1.6;
    max-height: 100px;
    overflow-y: auto;
  }
  .btn-area {
    display: flex;
    gap: 10px;
    width: 100%;
    flex-shrink: 0;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-later {
    background: #f1f5f9;
    color: #64748b;
    border: 1px solid #e2e8f0;
  }
  .btn-later:hover { background: #e2e8f0; color: #475569; }
  .btn-update {
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(59,130,246,0.3);
  }
  .btn-update:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59,130,246,0.4); }
</style>
</head>
<body>
<div class="header">
  <h1>检查更新</h1>
  <div class="header-btns">
    <button class="header-btn" id="btnClose" title="关闭">✕</button>
  </div>
</div>
<div class="content">
  <div class="update-icon">&#128640;</div>
  <div class="title">发现新版本</div>
  <div class="version-info">当前版本 <span id="currentVer">1.0.0</span> &rarr; 最新版本 <span id="newVer">1.1.0</span></div>
  <div class="changelog-box" id="changelog">更新内容加载中...</div>
  <div class="btn-area">
    <button class="btn btn-later" id="btnLater">稍后更新</button>
    <button class="btn btn-update" id="btnUpdate">立即更新</button>
  </div>
</div>
<script>
  var updateUrl = '';

  window.api.onUpdateInfo(function(info) {
    document.getElementById('currentVer').textContent = info.currentVersion;
    document.getElementById('newVer').textContent = info.newVersion;
    document.getElementById('changelog').textContent = info.changelog;
    updateUrl = info.url || '';
  });

  document.getElementById('btnClose').addEventListener('click', function() {
    window.api.closeUpdate();
  });

  document.getElementById('btnLater').addEventListener('click', function() {
    window.api.closeUpdate();
  });

  document.getElementById('btnUpdate').addEventListener('click', function() {
    window.api.installUpdate();
  });
</script>
</body>
</html>
