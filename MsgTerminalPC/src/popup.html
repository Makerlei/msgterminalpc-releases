<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .popup {
    width: 460px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.18), 0 8px 20px rgba(0,0,0,0.08);
    overflow: hidden;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1px solid rgba(0,0,0,0.04);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .popup-header {
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .popup-header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 200px;
    height: 200px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .popup-header::after {
    content: '';
    position: absolute;
    bottom: -60%;
    left: 10%;
    width: 150px;
    height: 150px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .popup-header .icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.18);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    z-index: 1;
    backdrop-filter: blur(8px);
  }
  .popup-header .title {
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 1;
  }
  .popup-header .time {
    margin-left: auto;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-family: 'Consolas', monospace;
    z-index: 1;
  }
  .sound-wave {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    z-index: 1;
  }
  .sound-wave span {
    display: inline-block;
    width: 3px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite;
  }
  .sound-wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
  .sound-wave span:nth-child(2) { height: 14px; animation-delay: 0.15s; }
  .sound-wave span:nth-child(3) { height: 10px; animation-delay: 0.3s; }
  .sound-wave span:nth-child(4) { height: 16px; animation-delay: 0.45s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.35); }
  }
  .popup-body {
    padding: 28px 28px 20px;
  }
  .msg-label {
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 14px;
    font-weight: 700;
  }
  .msg-text {
    font-size: 24px;
    color: #0f172a;
    line-height: 1.5;
    font-weight: 700;
    word-break: break-all;
    max-height: 120px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .msg-text::-webkit-scrollbar { width: 4px; }
  .msg-text::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 2px; }
  .popup-footer {
    padding: 0 28px 28px;
    display: flex;
    gap: 12px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .btn-confirm {
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    color: #ffffff;
    box-shadow: 0 4px 16px rgba(59,130,246,0.35);
  }
  .btn-confirm:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(59,130,246,0.4);
  }
  .btn-confirm:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(59,130,246,0.3);
  }
  .btn-later {
    background: #f8fafc;
    color: #64748b;
    border: 1px solid #e2e8f0;
  }
  .btn-later:hover {
    background: #f1f5f9;
    color: #475569;
  }
</style>
</head>
<body>
<div class="popup" id="popup">
  <div class="popup-header">
    <div class="icon">&#128232;</div>
    <div class="title">新消息</div>
    <div class="sound-wave">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="time" id="msgTime">00:00:00</div>
  </div>
  <div class="popup-body">
    <div class="msg-label">消息内容</div>
    <div class="msg-text" id="msgText">等待消息...</div>
  </div>
  <div class="popup-footer">
    <button class="btn btn-later" id="btnLater">稍后</button>
    <button class="btn btn-confirm" id="btnConfirm">确认已读</button>
  </div>
</div>

<script>
  var currentMsg = null;

  // ========== 语音播报 ==========
  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      setTimeout(function() {
        try {
          var voices = speechSynthesis.getVoices();
          var zhVoice = null;
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang.indexOf('zh') >= 0) {
              zhVoice = voices[i];
              if (voices[i].name.indexOf('Xiaoxiao') >= 0 ||
                  voices[i].name.indexOf('Yaoyao') >= 0 ||
                  voices[i].name.indexOf('Huihui') >= 0 ||
                  voices[i].name.indexOf('Kangkang') >= 0) break;
            }
          }
          var utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'zh-CN';
          utter.volume = 1.0;
          utter.rate = 0.95;
          utter.pitch = 1.1;
          if (zhVoice) utter.voice = zhVoice;
          utter.onerror = function() {};
          speechSynthesis.speak(utter);
        } catch(e2) {}
      }, 100);
    } catch(e) {}
  }


  // ========== 三连升调提示音 ==========
  function playDing() {
    try {
      var audioCtx = new AudioContext();
      var notes = [1047, 1319, 1568];
      var delays = [0, 0.15, 0.3];
      var durations = [0.25, 0.25, 0.5];
      var volumes = [0.5, 0.5, 0.6];
      for (var i = 0; i < notes.length; i++) {
        (function(idx) {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = notes[idx];
          osc.type = 'sine';
          gain.gain.setValueAtTime(volumes[idx], audioCtx.currentTime + delays[idx]);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delays[idx] + durations[idx]);
          osc.start(audioCtx.currentTime + delays[idx]);
          osc.stop(audioCtx.currentTime + delays[idx] + durations[idx]);
        })(i);
      }
    } catch(e) {}
  }

  // ========== 显示消息 ==========
  function showMsg(msg) {
    currentMsg = msg;
    document.getElementById('msgText').textContent = msg.text;
    document.getElementById('msgTime').textContent = msg.time;
    playDing();
    if (msg.voiceEnabled !== false) {
      setTimeout(function() { speak(msg.text); }, 500);
    }
  }

  window.api.onNewMessage(function(msg) {
    showMsg(msg);
  });

  // ========== 按钮 ==========
  document.getElementById('btnConfirm').addEventListener('click', function() {
    if (currentMsg) {
      var msgId = currentMsg.id;
      currentMsg = null;
      window.api.getMessages().then(function(msgs) {
        for (var i = 0; i < msgs.length; i++) {
          if (msgs[i].id === msgId) {
            msgs[i].read = true;
            msgs[i].readTime = new Date().toLocaleTimeString('zh-CN');
            break;
          }
        }
        return window.api.saveMessages(msgs);
      }).then(function() {
        window.api.closePopup();
      });
    } else {
      window.api.closePopup();
    }
  });

  document.getElementById('btnLater').addEventListener('click', function() {
    currentMsg = null;
    window.api.closePopup();
  });
</script>
</body>
</html>
