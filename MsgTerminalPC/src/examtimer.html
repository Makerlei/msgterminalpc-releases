<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a; color: #e2e8f0;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    overflow: hidden; user-select: none;
    display: flex; flex-direction: column; height: 100vh; width: 100vw;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2vmin 2vmin; background: rgba(15,23,42,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    -webkit-app-region: drag; flex-shrink: 0;
  }
  .topbar-title { font-size: 2.4vmin; font-weight: 600; color: #94a3b8; letter-spacing: 0.4vmin; }
  .topbar-btns { display: flex; gap: 1.2vmin; -webkit-app-region: no-drag; }
  .topbar-btns button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #94a3b8; padding: 0.8vmin 1.8vmin; border-radius: 1vmin; cursor: pointer;
    font-size: 2vmin; transition: all 0.15s;
  }
  .topbar-btns button:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
  .topbar-btns .close-btn:hover { background: #dc2626; color: #fff; border-color: #dc2626; }

  .setup-panel {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3.5vmin; padding: 5vmin;
  }
  .setup-panel.hidden { display: none; }

  .setup-row {
    display: flex; align-items: center; gap: 2vmin; width: 100%; max-width: 80vmin;
  }
  .setup-label {
    width: 20vmin; text-align: right; font-size: 3.6vmin; color: #94a3b8; flex-shrink: 0; font-weight: 500;
  }
  .setup-input {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: #e2e8f0; padding: 2vmin 2.4vmin; border-radius: 1.2vmin; font-size: 3.6vmin; outline: none;
    transition: border-color 0.15s;
  }
  .setup-input:focus { border-color: #3b82f6; }
  select.setup-input { cursor: pointer; }
  select.setup-input option { background: #1e293b; color: #e2e8f0; }

  .time-row { display: flex; gap: 1.2vmin; align-items: center; flex: 1; margin-left: 0; }
  .time-input {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: #e2e8f0; padding: 2vmin 1.2vmin; border-radius: 1.2vmin; font-size: 4.2vmin; text-align: center;
    outline: none; font-family: 'Orbitron', 'Consolas', monospace;
  }
  .time-input:focus { border-color: #3b82f6; }
  .time-sep { color: #64748b; font-size: 3.6vmin; font-weight: bold; }

  .preset-row { display: flex; gap: 1.5vmin; flex-wrap: wrap; justify-content: center; }
  .preset-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: #94a3b8; padding: 1.4vmin 2.8vmin; border-radius: 1vmin; cursor: pointer;
    font-size: 3.2vmin; transition: all 0.15s;
  }
  .preset-btn:hover { background: rgba(59,130,246,0.2); color: #60a5fa; border-color: #3b82f6; }

  .start-btn {
    margin-top: 2vmin; background: linear-gradient(135deg, #2563eb, #7c3aed);
    border: none; color: #fff; padding: 2.5vmin 10vmin; border-radius: 2vmin;
    font-size: 4.2vmin; font-weight: 600; cursor: pointer; letter-spacing: 0.8vmin;
    box-shadow: 0 0.8vmin 4vmin rgba(37,99,235,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .start-btn:hover { transform: scale(1.03); box-shadow: 0 1vmin 5vmin rgba(37,99,235,0.4); }
  .start-btn:active { transform: scale(0.98); }

  /* ============ 等待页面 ============ */
  .wait-panel {
    flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vmin; padding: 4vmin;
  }
  .wait-panel.active { display: flex; }

  .wait-subject {
    font-size: 10vmin; font-weight: 700; color: #60a5fa; letter-spacing: 1vmin;
  }
  .wait-label {
    font-size: 4.5vmin; color: #94a3b8; letter-spacing: 0.6vmin; font-weight: 500;
  }
  .wait-countdown {
    font-family: 'Orbitron', 'Consolas', 'Courier New', monospace;
    font-size: 20vmin; font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; line-height: 1.1;
  }
  .wait-countdown .blink {
    animation: blinkColon 1s step-end infinite;
  }
  @keyframes blinkColon {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .wait-info {
    font-size: 3.8vmin; color: #64748b; margin-top: 2vmin;
  }
  .wait-info span { color: #e2e8f0; font-weight: 600; }
  .wait-hint {
    font-size: 3.2vmin; color: #475569; margin-top: 3vmin;
    padding: 1.5vmin 4vmin; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 1.5vmin; background: rgba(255,255,255,0.03);
  }

  /* ============ 倒计时面板 ============ */
  .exam-panel {
    flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 0; padding: 2vmin 4vmin;
  }
  .exam-panel.active { display: flex; }

  .exam-row1 {
    display: flex; justify-content: center; gap: 8vmin;
    font-size: 8.4vmin; color: #94a3b8; margin-bottom: 3vmin;
  }
  .exam-row1 span { color: #e2e8f0; font-weight: 600; }

  .exam-subject {
    font-size: 10.4vmin; font-weight: 700; color: #60a5fa; letter-spacing: 1vmin;
  }

  .countdown-label {
    font-size: 4.8vmin; color: #ffffff; margin-bottom: 1.5vmin; letter-spacing: 0.8vmin; font-weight: 600;
  }
  .countdown-time {
    font-family: 'Orbitron', 'Consolas', 'Courier New', monospace;
    font-size: 24vmin; font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; line-height: 1.05;
    text-shadow: none;
  }
  .countdown-time.urgent {
    background: linear-gradient(135deg, #f87171, #fb923c);
    -webkit-background-clip: text; background-clip: text;
    animation: urgentPulse 1s ease-in-out infinite;
  }

  @keyframes urgentPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .exam-row4 {
    font-size: 3.8vmin; color: #94a3b8; margin-top: 3vmin;
  }
  .exam-row4 span { color: #e2e8f0; font-weight: 600; }

  .exam-notes {
    font-size: 4vmin; color: #fbbf24; text-align: center;
    line-height: 1.6; min-height: 4vmin; font-weight: 600; letter-spacing: 0.3vmin;
    margin-top: 2vmin;
  }

  .exam-actions {
    display: flex; gap: 3vmin; margin-top: 4vmin;
  }
  .exam-actions button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: #94a3b8; padding: 1.8vmin 5vmin; border-radius: 1.2vmin; cursor: pointer;
    font-size: 3.6vmin; transition: all 0.15s;
  }
  .exam-actions button:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
  .exam-actions .end-btn:hover { background: #dc2626; color: #fff; border-color: #dc2626; }

  .finished-overlay {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.95);
    flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
    z-index: 100;
  }
  .finished-overlay.active { display: flex; }
  .finished-icon { font-size: 16vmin; }
  .finished-text { font-size: 8vmin; font-weight: 700; color: #f87171; letter-spacing: 1.5vmin; }
  .finished-sub { font-size: 4vmin; color: #94a3b8; }
  .finished-btn {
    margin-top: 2vmin; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #e2e8f0; padding: 2vmin 6vmin; border-radius: 1.5vmin; cursor: pointer;
    font-size: 3.6vmin; transition: all 0.15s;
  }
  .finished-btn:hover { background: rgba(255,255,255,0.12); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">考 试 计 时</div>
  <div class="topbar-btns">
    <button id="btnMinimize">─</button>
    <button id="btnClose" class="close-btn">✕</button>
  </div>
</div>

<div class="setup-panel" id="setupPanel">
  <div class="setup-row">
    <div class="setup-label">考试科目</div>
    <select class="setup-input" id="subject" style="flex:0 0 auto; width: 45%;">
      <option value="语文">语文</option>
      <option value="数学">数学</option>
      <option value="英语">英语</option>
      <option value="物理">物理</option>
      <option value="化学">化学</option>
      <option value="道德与法治">道德与法治</option>
      <option value="历史">历史</option>
      <option value="地理">地理</option>
      <option value="生物">生物</option>
      <option value="信息与科技">信息与科技</option>
      <option value="音乐">音乐</option>
      <option value="自定义">自定义</option>
    </select>
    <input class="setup-input" id="customSubject" placeholder="请输入科目名称" style="display:none; flex:1; margin-left: 1.5vmin;">
  </div>
  <div class="setup-row">
    <div class="setup-label">考试时间</div>
    <div class="time-row">
      <input class="time-input" id="cdH" type="number" min="0" max="24" value="1">
      <span class="time-sep">时</span>
      <input class="time-input" id="cdM" type="number" min="0" max="59" value="30">
      <span class="time-sep">分</span>
    </div>
  </div>
  <div class="preset-row">
    <div class="preset-btn" data-m="45">45分钟</div>
    <div class="preset-btn" data-m="60">60分钟</div>
    <div class="preset-btn" data-m="90">90分钟</div>
    <div class="preset-btn" data-m="100">100分钟</div>
    <div class="preset-btn" data-m="120">120分钟</div>
  </div>
  <div class="setup-row">
    <div class="setup-label">开始时间</div>
    <input class="setup-input" id="startTime" type="time" value="" style="flex:1; max-width: 30vmin;">
  </div>
  <div class="setup-row">
    <div class="setup-label">监考员</div>
    <input class="setup-input" id="proctor" placeholder="请输入监考员姓名">
  </div>
  <div class="setup-row">
    <div class="setup-label">注意事项</div>
    <input class="setup-input" id="notes" value="诚信考试 拒绝作弊">
  </div>
  <button class="start-btn" id="btnStart">开 始 考 试</button>
</div>

<div class="wait-panel" id="waitPanel">
  <div class="wait-subject" id="waitSubject"></div>
  <div class="wait-label">距 离 考 试 开 始</div>
  <div class="wait-countdown" id="waitCountdown">00:00:00</div>
  <div class="wait-info">监考员：<span id="waitProctor"></span></div>
  <div class="wait-hint">考试时间到后将自动开始倒计时</div>
</div>

<div class="exam-panel" id="examPanel">
  <div class="exam-row1">
    <div>科目：<span id="examSubject"></span></div>
    <div>总时长：<span id="examDuration"></span></div>
  </div>
  <div class="countdown-label">距 离 考 试 结 束</div>
  <div class="countdown-time" id="countdownTime">01:30:00</div>
  <div class="exam-row4">监考员：<span id="examProctor"></span></div>
  <div class="exam-notes" id="examNotes"></div>
  <div class="exam-actions">
    <button id="btnPause">暂停</button>
    <button id="btnEnd" class="end-btn">结束考试</button>
  </div>
</div>

<div class="finished-overlay" id="finishedOverlay">
  <div class="finished-icon">&#9200;</div>
  <div class="finished-text">考试结束</div>
  <div class="finished-sub" id="finishedSub"></div>
  <button class="finished-btn" id="btnBack">返回设置</button>
</div>

<script>
  var subjectEl = document.getElementById('subject');
  var customSubjectEl = document.getElementById('customSubject');
  var cdH = document.getElementById('cdH');
  var cdM = document.getElementById('cdM');
  var startTimeEl = document.getElementById('startTime');
  var proctorEl = document.getElementById('proctor');
  var notesEl = document.getElementById('notes');
  var setupPanel = document.getElementById('setupPanel');
  var waitPanel = document.getElementById('waitPanel');
  var examPanel = document.getElementById('examPanel');
  var countdownTimeEl = document.getElementById('countdownTime');
  var examSubjectEl = document.getElementById('examSubject');
  var examProctorEl = document.getElementById('examProctor');
  var examDurationEl = document.getElementById('examDuration');
  var examNotesEl = document.getElementById('examNotes');
  var finishedOverlay = document.getElementById('finishedOverlay');
  var finishedSub = document.getElementById('finishedSub');
  var btnPause = document.getElementById('btnPause');
  var waitCountdownEl = document.getElementById('waitCountdown');
  var waitSubjectEl = document.getElementById('waitSubject');
  var waitProctorEl = document.getElementById('waitProctor');

  var totalSeconds = 0;
  var remaining = 0;
  var timer = null;
  var waitTimer = null;
  var paused = false;
  var warned15 = false;

  subjectEl.addEventListener('change', function() {
    customSubjectEl.style.display = this.value === '自定义' ? 'block' : 'none';
  });

  ['cdH','cdM'].forEach(function(id) {
    var el = document.getElementById(id);
    el.addEventListener('input', function() {
      if (this.value === '' || parseInt(this.value) < 0) this.value = '0';
      if (parseInt(this.value) > 59 && this.id !== 'cdH') this.value = '59';
      if (parseInt(this.value) > 24 && this.id === 'cdH') this.value = '24';
    });
    el.addEventListener('blur', function() {
      if (this.value === '' || isNaN(parseInt(this.value))) this.value = '0';
    });
  });

  document.querySelectorAll('.preset-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var m = parseInt(this.getAttribute('data-m'));
      cdH.value = Math.floor(m / 60);
      cdM.value = m % 60;
    });
  });

  function formatTime(s) {
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function formatTimeNoSec(s) {
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }

  function formatDuration(s) {
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    if (h > 0 && m > 0) return h + '小时' + m + '分钟';
    if (h > 0) return h + '小时';
    return m + '分钟';
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.volume = 1.0;
    u.rate = 0.95;
    u.pitch = 1.1;
    var voices = speechSynthesis.getVoices();
    var preferred = ['Xiaoxiao','Yaoyao','Huihui','Kangkang'];
    for (var i = 0; i < preferred.length; i++) {
      for (var j = 0; j < voices.length; j++) {
        if (voices[j].name.indexOf(preferred[i]) !== -1) { u.voice = voices[j]; break; }
      }
      if (u.voice) break;
    }
    speechSynthesis.speak(u);
  }

  function playWarningSound() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var freqs = [1047, 1319, 1568];
      freqs.forEach(function(f, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = f;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.5, ctx.currentTime + i * 0.2);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.2 + 0.4);
        osc.start(ctx.currentTime + i * 0.2);
        osc.stop(ctx.currentTime + i * 0.2 + 0.4);
      });
    } catch(e) {}
  }

  function startExamCountdown() {
    paused = false;
    warned15 = false;
    remaining = totalSeconds;
    countdownTimeEl.textContent = formatTime(remaining);
    countdownTimeEl.classList.remove('urgent');
    btnPause.textContent = '暂停';
    waitPanel.classList.remove('active');
    waitPanel.style.display = 'none';
    examPanel.classList.add('active');
    examPanel.style.display = 'flex';
    window.api.startPreventSleep();
    timer = setInterval(updateCountdown, 1000);
  }

  function updateCountdown() {
    if (paused) return;
    remaining--;
    if (remaining <= 0) {
      remaining = 0;
      clearInterval(timer);
      timer = null;
      countdownTimeEl.textContent = '00:00:00';
      countdownTimeEl.classList.remove('urgent');
      btnPause.textContent = '暂停';
      playWarningSound();
      window.api.stopPreventSleep();
      speak('考试时间到，请停止答题。');
      var subject = examSubjectEl.textContent;
      var proctor = examProctorEl.textContent;
      finishedSub.textContent = subject + ' · 监考员：' + proctor;
      finishedOverlay.classList.add('active');
      return;
    }
    countdownTimeEl.textContent = formatTime(remaining);
    if (remaining <= 900) {
      countdownTimeEl.classList.add('urgent');
    }
    if (remaining === 900 && !warned15) {
      warned15 = true;
      playWarningSound();
      speak('距离考试结束还有15分钟，请注意时间。');
    }
    if (remaining === 300 && !warned15) {
      playWarningSound();
      speak('距离考试结束还有5分钟，请注意时间。');
    }
  }

  function updateWaitCountdown() {
    var now = new Date();
    var parts = startTimeEl.value.split(':');
    var startH = parseInt(parts[0]) || 0;
    var startM = parseInt(parts[1]) || 0;
    var startSec = startH * 3600 + startM * 60;
    var nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    var diff = startSec - nowSec;
    if (diff <= 0) {
      clearInterval(waitTimer);
      waitTimer = null;
      startExamCountdown();
      return;
    }
    var h = String(Math.floor(diff / 3600)).padStart(2, '0');
    var m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
    var s = String(diff % 60).padStart(2, '0');
    waitCountdownEl.textContent = h + ':' + m + ':' + s;
  }

  document.getElementById('btnStart').addEventListener('click', function() {
    var h = parseInt(cdH.value) || 0;
    var m = parseInt(cdM.value) || 0;
    totalSeconds = h * 3600 + m * 60;
    if (totalSeconds <= 0) return;

    var subject = subjectEl.value;
    if (subject === '自定义') {
      subject = customSubjectEl.value.trim() || '自定义科目';
    }
    var proctor = proctorEl.value.trim() || '未填写';
    var notes = notesEl.value.trim();

    examSubjectEl.textContent = subject;
    examProctorEl.textContent = proctor;
    examDurationEl.textContent = formatDuration(totalSeconds);
    examNotesEl.textContent = notes;

    var startVal = startTimeEl.value;
    if (startVal) {
      var now = new Date();
      var parts = startVal.split(':');
      var startH = parseInt(parts[0]) || 0;
      var startM = parseInt(parts[1]) || 0;
      var startSec = startH * 3600 + startM * 60;
      var nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      var diff = startSec - nowSec;

      if (diff > 0) {
        setupPanel.classList.remove('active');
        setupPanel.style.display = 'none';
        waitSubjectEl.textContent = subject;
        waitProctorEl.textContent = proctor;
        var wh = String(Math.floor(diff / 3600)).padStart(2, '0');
        var wm = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
        var ws = String(diff % 60).padStart(2, '0');
        waitCountdownEl.textContent = wh + ':' + wm + ':' + ws;
        waitPanel.classList.add('active');
        waitPanel.style.display = 'flex';
        waitTimer = setInterval(updateWaitCountdown, 1000);
        return;
      }
    }

    setupPanel.classList.remove('active');
    setupPanel.style.display = 'none';
    startExamCountdown();
  });

  btnPause.addEventListener('click', function() {
    if (!timer && remaining > 0) {
      paused = false;
      timer = setInterval(updateCountdown, 1000);
      btnPause.textContent = '暂停';
      return;
    }
    paused = !paused;
    if (paused) {
      clearInterval(timer);
      timer = null;
      btnPause.textContent = '继续';
    } else {
      timer = setInterval(updateCountdown, 1000);
      btnPause.textContent = '暂停';
    }
  });

  document.getElementById('btnEnd').addEventListener('click', function() {
    if (timer) { clearInterval(timer); timer = null; }
    remaining = 0;
    countdownTimeEl.textContent = '00:00:00';
    countdownTimeEl.classList.remove('urgent');
    btnPause.textContent = '暂停';
    window.api.stopPreventSleep();
    var subject = examSubjectEl.textContent;
    var proctor = examProctorEl.textContent;
    finishedSub.textContent = subject + ' · 监考员：' + proctor;
    finishedOverlay.classList.add('active');
  });

  document.getElementById('btnBack').addEventListener('click', function() {
    finishedOverlay.classList.remove('active');
    examPanel.classList.remove('active');
    examPanel.style.display = 'none';
    setupPanel.style.display = 'flex';
    setupPanel.classList.add('active');
  });

  document.getElementById('btnMinimize').addEventListener('click', function() {
    window.api.minimizeExamTimer();
  });
  document.getElementById('btnClose').addEventListener('click', function() {
    if (timer) { clearInterval(timer); timer = null; }
    if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
    window.api.stopPreventSleep();
    window.api.closeExamTimer();
  });

  speechSynthesis.onvoiceschanged = function() {};
</script>
