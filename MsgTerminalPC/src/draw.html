<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;touch-action:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;cursor:none;touch-action:none}

#cur{position:fixed;pointer-events:none;z-index:99999;display:none;left:-100px;top:-100px}
#cur.show{display:block}

.toolbar{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:5px;
  background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.12);border-radius:14px;
  padding:8px 12px;z-index:10;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  cursor:default;user-select:none;-webkit-user-select:none;
}
.sep{width:1px;height:20px;background:rgba(255,255,255,0.1);margin:0 2px}

.tbtn{
  width:30px;height:30px;border:none;border-radius:7px;
  background:transparent;color:#94a3b8;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.tbtn:hover{background:rgba(255,255,255,0.1);color:#e2e8f0}
.tbtn.on{background:rgba(59,130,246,0.25);color:#3b82f6}
.tbtn.gm{background:rgba(16,185,129,0.25);color:#10b981}

.abtn{
  padding:5px 10px;border:none;border-radius:7px;
  font-size:11px;font-weight:700;cursor:pointer;transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.abtn-undo{background:rgba(255,255,255,0.08);color:#94a3b8}
.abtn-undo:hover{background:rgba(255,255,255,0.14);color:#e2e8f0}
.abtn-clear{background:rgba(239,68,68,0.18);color:#f87171}
.abtn-clear:hover{background:rgba(239,68,68,0.3)}
.abtn-close{background:rgba(59,130,246,0.2);color:#60a5fa}
.abtn-close:hover{background:rgba(59,130,246,0.35)}

.colors{display:flex;align-items:center;gap:4px}
.cb{width:18px;height:18px;border:2px solid transparent;border-radius:50%;cursor:pointer;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.cb:hover{transform:scale(1.2)}
.cb.on{border-color:#fff;box-shadow:0 0 0 2px rgba(59,130,246,0.6)}

.sizes{display:flex;align-items:center;gap:4px}
.sb{border-radius:50%;background:#94a3b8;cursor:pointer;border:2px solid transparent;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.sb:hover{background:#e2e8f0}
.sb.on{border-color:#3b82f6;background:#3b82f6}

.shape-wrap{position:relative}
.shape-pop{
  display:none;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.12);border-radius:12px;
  padding:6px;gap:4px;flex-wrap:wrap;width:148px;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:20;
}
.shape-pop.show{display:flex}
.shape-pop .lbl{width:100%;text-align:center;font-size:9px;color:rgba(255,255,255,0.3);margin-bottom:2px}
.sp{
  width:30px;height:30px;border:none;border-radius:7px;
  background:transparent;color:#94a3b8;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;-webkit-tap-highlight-color:transparent;
}
.sp:hover{background:rgba(255,255,255,0.1);color:#e2e8f0}
.sp.on{background:rgba(59,130,246,0.25);color:#3b82f6}

.mhint{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:rgba(16,185,129,0.15);color:#10b981;
  padding:6px 16px;border-radius:8px;font-size:12px;font-weight:600;
  white-space:nowrap;display:none;pointer-events:none;
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cur"></div>

<div class="toolbar" id="tb">
  <div class="mhint" id="mhint">鼠标模式 - 移到工具栏上恢复绘制</div>
  <button class="tbtn" id="btnM" title="鼠标">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-7 2-3 7z"/></svg>
  </button>
  <div class="sep"></div>
  <button class="tbtn on" data-tool="pen" title="画笔">&#9998;</button>
  <button class="tbtn" data-tool="eraser" title="橡皮擦">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14.2 2.2c.8-.8 2-.8 2.8 0l5 5c.8.8.8 2 0 2.8L11 21"/><line x1="18" y1="13" x2="11" y2="6"/></svg>
  </button>
  <div class="shape-wrap">
    <button class="tbtn" id="btnS" title="图形">&#9645;&#9675;</button>
    <div class="shape-pop" id="spop">
      <span class="lbl">图形工具</span>
      <button class="sp" data-tool="line" title="直线" style="font-size:16px">&#9585;</button>
      <button class="sp" data-tool="arrow" title="箭头" style="font-size:16px">&#8594;</button>
      <button class="sp" data-tool="rect" title="矩形" style="font-size:16px">&#9645;</button>
      <button class="sp" data-tool="circle" title="圆形" style="font-size:16px">&#9675;</button>
      <button class="sp" data-tool="ellipse" title="椭圆" style="font-size:16px">&#11053;</button>
      <button class="sp" data-tool="triangle" title="三角形" style="font-size:16px">&#9651;</button>
      <button class="sp" data-tool="diamond" title="菱形" style="font-size:16px">&#9671;</button>
    </div>
  </div>
  <div class="sep"></div>
  <div class="colors">
    <div class="cb on" data-color="#ff2d2d" style="background:#ff2d2d"></div>
    <div class="cb" data-color="#ffdd00" style="background:#ffdd00"></div>
    <div class="cb" data-color="#00e676" style="background:#00e676"></div>
    <div class="cb" data-color="#2979ff" style="background:#2979ff"></div>
    <div class="cb" data-color="#aa00ff" style="background:#aa00ff"></div>
    <div class="cb" data-color="#ffffff" style="background:#ffffff"></div>
    <div class="cb" data-color="#000000" style="background:#000000;border:1px solid #475569"></div>
  </div>
  <div class="sep"></div>
  <div class="sizes">
    <div class="sb" data-size="2" style="width:10px;height:10px"></div>
    <div class="sb on" data-size="4" style="width:14px;height:14px"></div>
    <div class="sb" data-size="8" style="width:18px;height:18px"></div>
    <div class="sb" data-size="12" style="width:22px;height:22px"></div>
  </div>
  <div class="sep"></div>
  <button class="abtn abtn-undo" id="btnU">撤销</button>
  <button class="abtn abtn-clear" id="btnC">清空</button>
  <button class="abtn abtn-close" id="btnX">关闭</button>
</div>

<script>
// ==================== 基础变量 ====================
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var tb = document.getElementById('tb');
var mhint = document.getElementById('mhint');
var spop = document.getElementById('spop');
var btnS = document.getElementById('btnS');
var btnM = document.getElementById('btnM');
var cur = document.getElementById('cur');
var W, H;
var tool = 'pen';
var color = '#ff2d2d';
var curSize = 4;
var drawing = false;
var sx = 0, sy = 0;
var paths = [];
var curPath = null;
var snap = null;
var mouseMode = false;
var clickThrough = false;
var lastDrawX = 0, lastDrawY = 0;
var overToolbar = false;

// ==================== 光标SVG ====================
var penSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="24" viewBox="0 0 20 24"><path d="M3 21L1 23l4-1L18 9l-3-3L3 19z" fill="#ff2d2d" stroke="white" stroke-width="0.8"/><path d="M15 6l3 3" stroke="white" stroke-width="1.2"/></svg>';
var eraserSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22"><rect x="3" y="3" width="16" height="16" rx="3" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/><line x1="6" y1="8" x2="16" y2="8" stroke="#ddd" stroke-width="0.8"/><line x1="6" y1="11" x2="16" y2="11" stroke="#ccc" stroke-width="1"/><line x1="6" y1="14" x2="16" y2="14" stroke="#ddd" stroke-width="0.8"/></svg>';

// ==================== Canvas尺寸 ====================
function resize() {
  var img = null;
  if (cv.width > 0 && cv.height > 0) { try { img = ctx.getImageData(0, 0, cv.width, cv.height); } catch(e) {} }
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W; cv.height = H;
  if (img) { try { ctx.putImageData(img, 0, 0); } catch(e) {} }
}
window.addEventListener('resize', resize);
resize();

// ==================== 光标管理 ====================
function refreshCursor() {
  cur.classList.remove('show');
  if (mouseMode || overToolbar) {
    cv.style.cursor = 'default';
    return;
  }
  if (tool === 'pen') {
    cv.style.cursor = 'none';
    cur.innerHTML = penSVG;
    cur._ox = 2; cur._oy = 22;
    cur.classList.add('show');
  } else if (tool === 'eraser') {
    cv.style.cursor = 'none';
    cur.innerHTML = eraserSVG;
    cur._ox = 11; cur._oy = 11;
    cur.classList.add('show');
  } else {
    cv.style.cursor = 'crosshair';
  }
}
refreshCursor();

// ==================== 鼠标跟随 + 工具栏检测 + 穿透 ====================
document.addEventListener('mousemove', function(e) {
  if (cur.classList.contains('show')) {
    cur.style.left = (e.clientX - (cur._ox || 0)) + 'px';
    cur.style.top = (e.clientY - (cur._oy || 0)) + 'px';
  }
  var r = tb.getBoundingClientRect();
  var wasOver = overToolbar;
  overToolbar = e.clientX >= r.left && e.clientX <= r.right &&
                e.clientY >= r.top && e.clientY <= r.bottom;
  if (wasOver !== overToolbar) refreshCursor();
  if (mouseMode) {
    var p = 10;
    var over = e.clientX >= r.left - p && e.clientX <= r.right + p && e.clientY >= r.top - p && e.clientY <= r.bottom + p;
    if (over && clickThrough) { clickThrough = false; try { window.api.setDrawClickThrough(false); } catch(ex) {} }
    else if (!over && !clickThrough) { clickThrough = true; try { window.api.setDrawClickThrough(true); } catch(ex) {} }
  }
});

// ==================== 坐标提取 ====================
function getPos(ev) {
  if (ev.touches && ev.touches.length > 0) return { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
  if (ev.changedTouches && ev.changedTouches.length > 0) return { x: ev.changedTouches[0].clientX, y: ev.changedTouches[0].clientY };
  return { x: ev.clientX, y: ev.clientY };
}
function prevent(ev) { if (ev.cancelable) ev.preventDefault(); }

// ==================== 工具栏拖动 ====================
var tbDrag = false, tbMoved = false, tbOX = 0, tbOY = 0;
function tbDown(ex, ey, ev) {
  if (ev.target.closest('button') || ev.target.closest('.cb') || ev.target.closest('.sb') || ev.target.closest('.sp')) return;
  tbDrag = true; tbMoved = false;
  var r = tb.getBoundingClientRect();
  tbOX = ex - r.left; tbOY = ey - r.top;
  tb.style.transition = 'none';
  prevent(ev);
}
function tbMove(ex, ey) {
  if (!tbDrag) return;
  tbMoved = true;
  tb.style.left = Math.max(0, Math.min(ex - tbOX, window.innerWidth - tb.offsetWidth)) + 'px';
  tb.style.top = Math.max(0, Math.min(ey - tbOY, window.innerHeight - tb.offsetHeight)) + 'px';
  tb.style.transform = 'none';
}
function tbUp() { tbDrag = false; }
tb.addEventListener('mousedown', function(e) { tbDown(e.clientX, e.clientY, e); });
document.addEventListener('mousemove', function(e) { tbMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', tbUp);
tb.addEventListener('touchstart', function(e) { var p = getPos(e); tbDown(p.x, p.y, e); }, { passive: false });
document.addEventListener('touchmove', function(e) { if (tbDrag) { var p = getPos(e); tbMove(p.x, p.y); prevent(e); } }, { passive: false });
document.addEventListener('touchend', tbUp);

// ==================== 鼠标穿透 ====================
function enterMouseMode() {
  mouseMode = true; clickThrough = true;
  btnM.classList.add('gm');
  mhint.style.display = 'block';
  spop.classList.remove('show');
  refreshCursor();
  try { window.api.setDrawClickThrough(true); } catch(e) {}
}
function exitMouseMode() {
  mouseMode = false; clickThrough = false;
  btnM.classList.remove('gm');
  mhint.style.display = 'none';
  refreshCursor();
  try { window.api.setDrawClickThrough(false); } catch(e) {}
}
btnM.addEventListener('click', function() {
  if (mouseMode) return;
  clearAllActive();
  enterMouseMode();
});

// ==================== 通用工具设置 ====================
function clearAllActive() {
  document.querySelectorAll('.tbtn[data-tool]').forEach(function(b) { b.classList.remove('on'); });
  document.querySelectorAll('.sp[data-tool]').forEach(function(b) { b.classList.remove('on'); });
  btnS.classList.remove('on');
}
function applyTool(t, el, isShape) {
  if (mouseMode) exitMouseMode();
  clearAllActive();
  el.classList.add('on');
  if (isShape) btnS.classList.add('on');
  tool = t;
  refreshCursor();
}
document.querySelectorAll('.tbtn[data-tool]').forEach(function(b) {
  b.addEventListener('click', function() { applyTool(b.dataset.tool, b, false); });
});
document.querySelectorAll('.sp[data-tool]').forEach(function(b) {
  b.addEventListener('click', function() { applyTool(b.dataset.tool, b, true); spop.classList.remove('show'); });
});
btnS.addEventListener('click', function(e) {
  if (mouseMode) { exitMouseMode(); clearAllActive(); }
  spop.classList.toggle('show');
  e.stopPropagation();
});
function closeShape(ev) { if (!ev.target.closest('.shape-wrap')) spop.classList.remove('show'); }
document.addEventListener('mousedown', closeShape);
document.addEventListener('touchstart', closeShape);

// ==================== 颜色和粗细 ====================
function applySizeColor() {
  var c = color === '#000000' ? '#94a3b8' : color;
  document.querySelectorAll('.sb').forEach(function(x) {
    if (x.classList.contains('on')) {
      x.style.background = c; x.style.borderColor = 'transparent';
      x.style.boxShadow = '0 0 0 2px #fff, 0 0 0 4px #666';
    } else {
      x.style.background = c; x.style.borderColor = 'transparent'; x.style.boxShadow = 'none';
    }
  });
}
document.querySelectorAll('.cb').forEach(function(b) {
  b.addEventListener('click', function() {
    if (mouseMode) exitMouseMode();
    document.querySelectorAll('.cb').forEach(function(x) { x.classList.remove('on'); });
    b.classList.add('on'); color = b.dataset.color; applySizeColor();
  });
});
document.querySelectorAll('.sb').forEach(function(b) {
  b.addEventListener('click', function() {
    if (mouseMode) exitMouseMode();
    document.querySelectorAll('.sb').forEach(function(x) { x.classList.remove('on'); });
    b.classList.add('on'); curSize = parseInt(b.dataset.size); applySizeColor();
  });
});
applySizeColor();

// ==================== 绘制函数 ====================
function beginPenStyle(c, col, sz) {
  c.strokeStyle = col; c.lineWidth = sz; c.lineCap = 'round'; c.lineJoin = 'round';
}
function drawSmoothPath(c, points, col, sz, isEraser) {
  if (points.length < 2) return;
  c.save();
  if (isEraser) { c.globalCompositeOperation = 'destination-out'; beginPenStyle(c, col, sz * 5); }
  else beginPenStyle(c, col, sz);
  c.beginPath(); c.moveTo(points[0].x, points[0].y);
  if (points.length === 2) { c.lineTo(points[1].x, points[1].y); }
  else {
    for (var i = 1; i < points.length - 1; i++) {
      var midX = (points[i].x + points[i + 1].x) / 2;
      var midY = (points[i].y + points[i + 1].y) / 2;
      c.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
    }
    c.lineTo(points[points.length - 1].x, points[points.length - 1].y);
  }
  c.stroke(); c.restore();
}
function drawIncremental(c, points, col, sz, isEraser) {
  var len = points.length;
  if (len < 2) return;
  c.save();
  if (isEraser) { c.globalCompositeOperation = 'destination-out'; beginPenStyle(c, col, sz * 5); }
  else beginPenStyle(c, col, sz);
  if (len === 2) {
    c.beginPath(); c.moveTo(points[0].x, points[0].y); c.lineTo(points[1].x, points[1].y); c.stroke();
  } else {
    var p0 = points[len - 3], p1 = points[len - 2], p2 = points[len - 1];
    c.beginPath();
    c.moveTo((p0.x + p1.x) / 2, (p0.y + p1.y) / 2);
    c.quadraticCurveTo(p1.x, p1.y, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
    c.stroke();
  }
  c.restore();
}
function drawShapePreview(c, p) {
  if (p.tool === 'line') {
    c.strokeStyle = p.color; c.lineWidth = p.size; c.lineCap = 'round';
    c.beginPath(); c.moveTo(p.sx, p.sy); c.lineTo(p.ex, p.ey); c.stroke();
  } else if (p.tool === 'arrow') {
    var a = Math.atan2(p.ey - p.sy, p.ex - p.sx);
    var hl = 16 + p.size, hw = 4 + p.size * 0.5;
    var bx = p.ex - hl * Math.cos(a), by = p.ey - hl * Math.sin(a);
    c.save(); c.strokeStyle = p.color; c.lineWidth = p.size; c.lineCap = 'round';
    c.beginPath(); c.moveTo(p.sx, p.sy); c.lineTo(bx, by); c.stroke(); c.restore();
    c.save(); c.fillStyle = p.color;
    c.beginPath(); c.moveTo(p.ex, p.ey);
    c.lineTo(bx + hw * Math.sin(a), by - hw * Math.cos(a));
    c.lineTo(bx - hw * Math.sin(a), by + hw * Math.cos(a));
    c.closePath(); c.fill(); c.restore();
  } else if (p.tool === 'rect') {
    c.strokeStyle = p.color; c.lineWidth = p.size; c.lineJoin = 'round';
    c.strokeRect(p.sx, p.sy, p.ex - p.sx, p.ey - p.sy);
  } else if (p.tool === 'circle') {
    var r = Math.sqrt((p.ex - p.sx) * (p.ex - p.sx) + (p.ey - p.sy) * (p.ey - p.sy));
    c.strokeStyle = p.color; c.lineWidth = p.size;
    c.beginPath(); c.arc(p.sx, p.sy, r, 0, Math.PI * 2); c.stroke();
  } else if (p.tool === 'ellipse') {
    var cx = (p.sx + p.ex) / 2, cy = (p.sy + p.ey) / 2;
    var rx = Math.abs(p.ex - p.sx) / 2, ry = Math.abs(p.ey - p.sy) / 2;
    c.strokeStyle = p.color; c.lineWidth = p.size;
    c.beginPath(); c.ellipse(cx, cy, Math.max(rx, 1), Math.max(ry, 1), 0, 0, Math.PI * 2); c.stroke();
  } else if (p.tool === 'triangle') {
    var mx = (p.sx + p.ex) / 2;
    c.strokeStyle = p.color; c.lineWidth = p.size; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(mx, p.sy); c.lineTo(p.ex, p.ey); c.lineTo(p.sx, p.ey); c.closePath(); c.stroke();
  } else if (p.tool === 'diamond') {
    var mx2 = (p.sx + p.ex) / 2, my = (p.sy + p.ey) / 2;
    c.strokeStyle = p.color; c.lineWidth = p.size; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(mx2, p.sy); c.lineTo(p.ex, my); c.lineTo(mx2, p.ey); c.lineTo(p.sx, my); c.closePath(); c.stroke();
  }
}
function drawStoredPath(c, p) {
  if (p.tool === 'pen' || p.tool === 'eraser') drawSmoothPath(c, p.points, p.color, p.size, p.tool === 'eraser');
  else drawShapePreview(c, p);
}
function redraw() {
  ctx.clearRect(0, 0, W, H);
  for (var i = 0; i < paths.length; i++) drawStoredPath(ctx, paths[i]);
}

// ==================== 绘制操作 ====================
function drawStart(ex, ey) {
  if (mouseMode) return;
  drawing = true; sx = ex; sy = ey; lastDrawX = ex; lastDrawY = ey;
  if (tool === 'pen' || tool === 'eraser') curPath = { tool: tool, color: color, size: curSize, points: [{ x: ex, y: ey }] };
  else snap = ctx.getImageData(0, 0, W, H);
}
function drawMove(ex, ey) {
  if (!drawing || mouseMode) return;
  if (tool === 'pen' || tool === 'eraser') {
    var dx = ex - lastDrawX, dy = ey - lastDrawY;
    if (dx * dx + dy * dy < 4) return;
    lastDrawX = ex; lastDrawY = ey;
    curPath.points.push({ x: ex, y: ey });
    drawIncremental(ctx, curPath.points, color, curSize, tool === 'eraser');
  } else {
    ctx.putImageData(snap, 0, 0);
    drawShapePreview(ctx, { tool: tool, color: color, size: curSize, sx: sx, sy: sy, ex: ex, ey: ey });
  }
}
function drawEnd(ex, ey) {
  if (!drawing || mouseMode) return;
  drawing = false;
  if (tool === 'pen' || tool === 'eraser') {
    if (curPath && curPath.points.length > 1) { paths.push(curPath); redraw(); }
    curPath = null;
  } else {
    paths.push({ tool: tool, color: color, size: curSize, sx: sx, sy: sy, ex: ex, ey: ey });
    redraw();
  }
}
cv.addEventListener('mousedown', function(e) { drawStart(e.clientX, e.clientY); });
cv.addEventListener('mousemove', function(e) { drawMove(e.clientX, e.clientY); });
cv.addEventListener('mouseup', function(e) { drawEnd(e.clientX, e.clientY); });
cv.addEventListener('touchstart', function(e) { prevent(e); var p = getPos(e); drawStart(p.x, p.y); }, { passive: false });
cv.addEventListener('touchmove', function(e) { prevent(e); var p = getPos(e); drawMove(p.x, p.y); }, { passive: false });
cv.addEventListener('touchend', function(e) { prevent(e); var p = getPos(e); drawEnd(p.x, p.y); }, { passive: false });

// ==================== 操作按钮 ====================
document.getElementById('btnU').addEventListener('click', function() { if (paths.length > 0) { paths.pop(); redraw(); } });
document.getElementById('btnC').addEventListener('click', function() { paths = []; redraw(); });
document.getElementById('btnX').addEventListener('click', function() { window.api.closeDraw(); });
</script>
</body>
</html>
